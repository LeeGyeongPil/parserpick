[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parserpick"
version = "0.1.1"
description = "Pick vLLM/SGLang tool-call and reasoning parser flags from a model's chat template, and replay captured raw output offline to see why a tool call leaked."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["vllm", "sglang", "tool-calling", "chat-template", "llm-serving", "reasoning-parser"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["jinja2==3.1.6"]

[project.scripts]
parserpick = "parserpick.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/parserpick"]

[tool.hatch.build.targets.sdist]
include = ["src/parserpick", "tests", "README.md", "README.ko.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need real network access (deselected by default)"]
addopts = "-m 'not network'"
